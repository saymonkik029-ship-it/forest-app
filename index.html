<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forest Restaurant PRO</title>
<script src="https://cdn.tailwindcss.com"></script>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#08130d;
color:white;
overflow:hidden;
}
.bg{
position:fixed;
inset:0;
background:url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?q=80&w=1600') center/cover;
opacity:.14;
z-index:-2;
}
.overlay{
position:fixed;
inset:0;
background:linear-gradient(135deg,#08130d,#10281b,#173626);
z-index:-1;
}
.glass{
background:rgba(10,22,16,.78);
backdrop-filter:blur(16px);
}
button{
transition:.2s;
}
button:active{
transform:scale(.96);
}
</style>
</head>

<body>

<div class="bg"></div>
<div class="overlay"></div>

<div class="h-screen flex flex-col">

<div class="glass p-4 flex items-center justify-between border-b border-emerald-700">

<div>
<div class="text-3xl font-black">🌲 Forest</div>
<div class="text-emerald-300 text-sm">Restaurant PRO</div>
</div>

<div class="flex gap-2">

<button onclick="openCategoryModal()"
class="bg-gradient-to-r from-orange-500 to-red-500 px-4 py-3 rounded-2xl font-black">
+ Вид
</button>

<button onclick="openOrders()"
class="bg-gradient-to-r from-cyan-500 to-teal-500 px-5 py-3 rounded-2xl font-black">
Заказы
</button>

</div>

</div>

<div class="flex-1 overflow-auto p-3">

<div id="categories"
class="grid grid-cols-2 gap-3 mb-4"></div>

<div id="menuSection" class="hidden">

<div class="flex justify-between items-center mb-4">

<div id="categoryTitle"
class="text-3xl font-black"></div>

<button onclick="openAddModal()"
class="bg-gradient-to-r from-emerald-500 to-green-600 px-4 py-3 rounded-2xl font-black">
+ Добавить
</button>

</div>

<div id="dishes" class="space-y-3"></div>

</div>

<div class="glass rounded-[30px] p-4 mt-5">

<div class="text-3xl font-black mb-4">
Текущий заказ
</div>

<div id="orderList" class="space-y-3 mb-4"></div>

<div class="flex justify-between text-2xl font-black mb-4">
<span>Итого</span>
<span id="total">0 ₽</span>
</div>

<button onclick="acceptOrder()"
class="w-full py-4 rounded-3xl text-2xl font-black bg-gradient-to-r from-emerald-500 to-teal-500">
Принять заказ
</button>

</div>

</div>

<script>

let categories = ['Первое','Второе','Десерты','Напитки','Алкоголь'];

let menu = {};
let currentCategory='';
let currentOrder=[];

categories.forEach(c=>menu[c]=[]);

function renderCategories(){

const container=document.getElementById('categories');

container.innerHTML='';

categories.forEach(category=>{

container.innerHTML += `
<button onclick="selectCategory('${category}')"
class="glass rounded-3xl p-5 text-left">

<div class="text-2xl font-black">${category}</div>

</button>
`;

});

}

function selectCategory(category){

currentCategory=category;

document.getElementById('menuSection').classList.remove('hidden');

document.getElementById('categoryTitle').innerText=category;

renderDishes();

}

function renderDishes(){

const container=document.getElementById('dishes');

container.innerHTML='';

if(menu[currentCategory].length===0){

container.innerHTML=`
<div class="glass rounded-3xl p-6 text-center opacity-70">
Нет блюд
</div>
`;

return;

}

menu[currentCategory].forEach((dish,index)=>{

container.innerHTML += `
<div class="glass rounded-[30px] p-4">

<div class="flex justify-between items-center">

<div>

<div class="text-2xl font-black">${dish.name}</div>

<div class="text-emerald-400 text-xl">
${dish.price} ₽
</div>

</div>

<button onclick="addToOrder(${index})"
class="bg-gradient-to-r from-emerald-500 to-green-600 px-5 py-3 rounded-2xl font-black">
+
</button>

</div>

</div>
`;

});

}

function addToOrder(index){

currentOrder.push(menu[currentCategory][index]);

renderOrder();

}

function renderOrder(){

const container=document.getElementById('orderList');

container.innerHTML='';

let total=0;

currentOrder.forEach((dish)=>{

total += dish.price;

container.innerHTML += `
<div class="glass rounded-2xl p-3 flex justify-between items-center">

<div>
<div class="font-black">${dish.name}</div>
<div class="text-emerald-400">${dish.price} ₽</div>
</div>

</div>
`;

});

document.getElementById('total').innerText=total + ' ₽';

}

function acceptOrder(){

if(currentOrder.length===0){
alert('Заказ пуст');
return;
}

alert('Заказ принят 🌲');

currentOrder=[];

renderOrder();

}

renderCategories();

</script>

</body>
</html>

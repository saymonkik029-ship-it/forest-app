<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forest Restaurant PRO</title>

<style>
body{
margin:0;
font-family:Arial;
background:linear-gradient(180deg,#111,#063);
color:white;
}

header{
display:flex;
justify-content:space-between;
align-items:center;
padding:20px;
}

.logo{
display:flex;
align-items:center;
gap:10px;
}

.logo h1{
margin:0;
font-size:42px;
}

.top-buttons{
display:flex;
gap:10px;
align-items:center;
}

.btn{
border:none;
padding:14px 22px;
border-radius:20px;
font-weight:bold;
cursor:pointer;
color:white;
}

.orange{
background:linear-gradient(45deg,#ff7b00,#ff4d6d);
}

.blue{
background:linear-gradient(45deg,#00b4ff,#29d3b2);
}

.settings-btn{
width:45px;
height:45px;
border-radius:50%;
border:none;
background:#111827;
color:white;
font-size:22px;
cursor:pointer;
}

.categories{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
padding:20px;
}

.category{
background:rgba(0,0,0,0.5);
padding:35px;
border-radius:30px;
font-size:26px;
font-weight:bold;
cursor:pointer;
position:relative;
}

.category-tools{
position:absolute;
top:10px;
right:10px;
display:flex;
gap:6px;
}

.small-btn{
border:none;
width:30px;
height:30px;
border-radius:10px;
font-size:16px;
cursor:pointer;
color:white;
}

.edit{
background:#00c2ff;
}

.delete{
background:#ff3b6b;
}

.order-box{
margin:20px;
background:rgba(0,0,0,0.55);
padding:25px;
border-radius:30px;
}

.order-item{
display:flex;
justify-content:space-between;
margin:8px 0;
}

.remove-item{
background:red;
border:none;
color:white;
border-radius:8px;
padding:4px 10px;
cursor:pointer;
}

.total{
display:flex;
justify-content:space-between;
font-size:36px;
font-weight:bold;
margin-top:20px;
}

.confirm{
width:100%;
margin-top:20px;
padding:18px;
border:none;
border-radius:20px;
background:#40f5ff;
font-size:26px;
font-weight:bold;
cursor:pointer;
}

input{
width:100%;
padding:14px;
border-radius:14px;
border:none;
margin-top:10px;
}

.modal{
position:fixed;
inset:0;
background:rgba(0,0,0,0.8);
display:none;
justify-content:center;
align-items:center;
padding:20px;
}

.modal-content{
background:#1a1a1a;
padding:20px;
border-radius:25px;
width:100%;
max-width:500px;
max-height:90vh;
overflow:auto;
}

.dish{
background:rgba(255,255,255,0.05);
padding:15px;
border-radius:18px;
margin-top:15px;
}

.dish-buttons{
display:flex;
gap:8px;
margin-top:10px;
}

.green{
background:#37ff73;
color:black;
}

.close-btn{
margin-top:20px;
background:#ff4b7d;
width:100%;
padding:14px;
border:none;
border-radius:15px;
font-size:18px;
font-weight:bold;
cursor:pointer;
color:white;
}
</style>
</head>

<body>

<header>
<div class="logo">
<div style="font-size:50px">🌲</div>
<div>
<h1>Forest</h1>
<div>Restaurant PRO</div>
</div>
</div>

<div class="top-buttons">
<button class="btn orange" onclick="addCategory()">+ Вид</button>
<button class="btn blue" onclick="openOrders()">Заказы</button>
<button class="settings-btn" onclick="openSettings()">⚙</button>
</div>
</header>

<div class="categories" id="categories"></div>

<div class="order-box">
<h1>Текущий заказ</h1>

<input id="tableNumber" placeholder="Номер столика">

<div id="currentOrder"></div>

<div class="total">
<span>Итого</span>
<span id="totalPrice">0 ₽</span>
</div>

<button class="confirm" onclick="confirmOrder()">
Подтвердить заказ
</button>
</div>

<div class="modal" id="modal">
<div class="modal-content">
<h1 id="modalTitle"></h1>

<button class="btn green" onclick="createDish()">
+ Добавить блюдо
</button>

<div id="dishList"></div>

<button class="close-btn" onclick="closeModal()">
Закрыть
</button>
</div>
</div>

<script>

let categories =
JSON.parse(localStorage.getItem("categories")) || [
{name:"Первое", dishes:[]},
{name:"Второе", dishes:[]},
{name:"Десерты", dishes:[]},
{name:"Напитки", dishes:[]},
{name:"Алкоголь", dishes:[]}
];

let currentCategory = null;

let currentOrder =
JSON.parse(localStorage.getItem("currentOrder")) || [];

let orders =
JSON.parse(localStorage.getItem("orders")) || [];

let history =
JSON.parse(localStorage.getItem("history")) || [];

function save(){
localStorage.setItem("categories",JSON.stringify(categories));
localStorage.setItem("currentOrder",JSON.stringify(currentOrder));
localStorage.setItem("orders",JSON.stringify(orders));
localStorage.setItem("history",JSON.stringify(history));
}

function renderCategories(){
const box=document.getElementById("categories");
box.innerHTML="";

categories.forEach((cat,index)=>{

box.innerHTML+=`
<div class="category" onclick="openCategory(${index})">

${cat.name}

<div class="category-tools">

<button class="small-btn edit"
onclick="event.stopPropagation();editCategory(${index})">
✏
</button>

<button class="small-btn delete"
onclick="event.stopPropagation();deleteCategory(${index})">
🗑
</button>

</div>

</div>
`;

});

}

function openCategory(index){
currentCategory=index;

document.getElementById("modal").style.display="flex";
document.getElementById("modalTitle").innerText=
categories[index].name;

renderDishes();
}

function closeModal(){
document.getElementById("modal").style.display="none";
}

function renderDishes(){

const list=document.getElementById("dishList");
list.innerHTML="";

categories[currentCategory].dishes.forEach((dish,i)=>{

list.innerHTML+=`
<div class="dish">

<h2>${dish.name}</h2>
<div>${dish.price} ₽</div>

<div class="dish-buttons">

<button class="small-btn green"
onclick="addDish(${i})">
+
</button>

<button class="small-btn edit"
onclick="editDish(${i})">
✏
</button>

<button class="small-btn delete"
onclick="deleteDish(${i})">
🗑
</button>

</div>

</div>
`;

});

}

function createDish(){

const name=prompt("Название блюда");
if(!name)return;

const price=prompt("Цена");
if(!price)return;

categories[currentCategory].dishes.push({
name,
price:Number(price)
});

save();
renderDishes();
}

function editDish(i){

const dish=categories[currentCategory].dishes[i];

dish.name=prompt("Название",dish.name);
dish.price=prompt("Цена",dish.price);

save();
renderDishes();
}

function deleteDish(i){

if(confirm("Удалить блюдо?")){

categories[currentCategory].dishes.splice(i,1);

save();
renderDishes();

}

}

function addDish(i){

const dish=categories[currentCategory].dishes[i];

currentOrder.push(dish);

save();
renderOrder();
}

function renderOrder(){

const box=document.getElementById("currentOrder");

box.innerHTML="";

let total=0;

currentOrder.forEach((dish,i)=>{

total+=Number(dish.price);

box.innerHTML+=`
<div class="order-item">

<div>
${dish.name} — ${dish.price} ₽
</div>

<button class="remove-item"
onclick="removeOrderItem(${i})">
X
</button>

</div>
`;

});

document.getElementById("totalPrice").innerText=
total+" ₽";

}

function removeOrderItem(i){

currentOrder.splice(i,1);

save();
renderOrder();
}

function confirmOrder(){

if(currentOrder.length===0)return;

const order={
table:
document.getElementById("tableNumber").value || "-",

items:[...currentOrder],

total:currentOrder.reduce((a,b)=>a+b.price,0),

date:new Date().toLocaleString()
};

orders.push(order);
history.push(order);

currentOrder=[];

document.getElementById("tableNumber").value="";

save();
renderOrder();

alert("Заказ подтвержден");

}

function openOrders(){

let text="";

orders.forEach((o,i)=>{

text+=`
#${i+1}
Стол: ${o.table}
Сумма: ${o.total} ₽
Дата: ${o.date}

`;

});

alert(text || "Нет заказов");

}

function openSettings(){

let text="";

history.forEach((o,i)=>{

text+=`
#${i+1}
Стол: ${o.table}
Сумма: ${o.total} ₽
Дата: ${o.date}

`;

});

alert(text || "История пуста");

}

function addCategory(){

const name=prompt("Название категории");

if(!name)return;

categories.push({
name,
dishes:[]
});

save();
renderCategories();
}

function editCategory(i){

const name=prompt(
"Новое название",
categories[i].name
);

if(!name)return;

categories[i].name=name;

save();
renderCategories();
}

function deleteCategory(i){

if(confirm("Удалить категорию?")){

categories.splice(i,1);

save();
renderCategories();

}

}

renderCategories();
renderOrder();

</script>

</body>
</html>

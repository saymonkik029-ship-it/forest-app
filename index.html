<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forest Restaurant PRO</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(90deg,#001d0d,#013d1c,#001d0d);
color:white;
min-height:100vh;
padding:20px;
}

.top{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:25px;
}

.logo{
display:flex;
align-items:center;
gap:12px;
}

.logo h1{
font-size:55px;
}

.logo p{
color:#8df7cf;
font-size:20px;
}

.top-buttons{
display:flex;
gap:15px;
align-items:center;
}

.btn{
border:none;
padding:20px 30px;
border-radius:25px;
font-size:26px;
font-weight:bold;
color:white;
cursor:pointer;
}

.add-type{
background:linear-gradient(45deg,#ff7a00,#ff3f8a);
}

.orders-btn{
background:linear-gradient(45deg,#00d2ff,#3aeeff);
}

.settings{
width:65px;
height:65px;
border-radius:50%;
border:none;
font-size:30px;
background:#04112f;
color:white;
cursor:pointer;
}

.categories{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
margin-bottom:30px;
}

.category{
background:rgba(0,0,0,0.55);
border-radius:30px;
padding:35px;
font-size:34px;
font-weight:bold;
cursor:pointer;
position:relative;
}

.category-tools{
position:absolute;
top:15px;
right:15px;
display:flex;
gap:10px;
}

.small-btn{
border:none;
border-radius:12px;
padding:8px 12px;
cursor:pointer;
font-size:16px;
font-weight:bold;
}

.edit{
background:#00c2ff;
color:white;
}

.delete{
background:#ff3b5f;
color:white;
}

.order-box{
background:rgba(0,0,0,0.55);
padding:30px;
border-radius:35px;
}

.order-box h2{
font-size:58px;
margin-bottom:20px;
}

.table-input{
width:100%;
padding:15px;
margin-bottom:20px;
border:none;
border-radius:15px;
font-size:24px;
}

.order-item{
display:flex;
justify-content:space-between;
align-items:center;
margin:15px 0;
font-size:24px;
}

.total{
display:flex;
justify-content:space-between;
font-size:42px;
font-weight:bold;
margin-top:25px;
}

.confirm{
width:100%;
margin-top:25px;
padding:25px;
border:none;
border-radius:30px;
font-size:38px;
font-weight:bold;
background:linear-gradient(45deg,#19d49d,#32d1d1);
color:white;
cursor:pointer;
}

.modal{
position:fixed;
inset:0;
background:rgba(0,0,0,0.8);
display:none;
justify-content:center;
align-items:center;
padding:20px;
z-index:999;
}

.modal-content{
background:#062914;
padding:25px;
border-radius:25px;
width:100%;
max-width:700px;
max-height:90vh;
overflow:auto;
}

.modal-content h2{
font-size:42px;
margin-bottom:20px;
}

.modal-content input{
width:100%;
padding:18px;
margin-bottom:15px;
border:none;
border-radius:15px;
font-size:22px;
}

.modal-content button{
width:100%;
padding:18px;
margin-top:10px;
border:none;
border-radius:18px;
font-size:24px;
font-weight:bold;
cursor:pointer;
}

.save{
background:#5aff7a;
}

.close{
background:#ff456d;
color:white;
}

.food-card{
background:#021a0e;
padding:18px;
border-radius:18px;
margin-bottom:15px;
}

.food-card h3{
font-size:28px;
margin-bottom:10px;
}

.food-card p{
font-size:22px;
margin-bottom:10px;
}

.food-card button{
margin-top:8px;
}

.history-card{
background:#021a0e;
padding:20px;
border-radius:20px;
margin-bottom:15px;
}

</style>
</head>
<body>

<div class="top">
<div class="logo">
<div style="font-size:60px;">🌲</div>
<div>
<h1>Forest</h1>
<p>Restaurant PRO</p>
</div>
</div>

<div class="top-buttons">
<button class="btn add-type" onclick="openTypeModal()">+ Вид</button>
<button class="btn orders-btn" onclick="openOrders()">Заказы</button>
<button class="settings" onclick="openSettings()">⚙</button>
</div>
</div>

<div class="categories" id="categories"></div>

<div class="order-box">
<h2>Текущий заказ</h2>

<input type="number" class="table-input" id="tableNumber" placeholder="Номер столика">

<div id="currentOrder"></div>

<div class="total">
<span>Итого</span>
<span id="total">0 ₽</span>
</div>

<button class="confirm" onclick="confirmOrder()">Подтвердить заказ</button>
</div>

<!-- Категория -->
<div class="modal" id="foodsModal">
<div class="modal-content">
<h2 id="foodsTitle"></h2>

<button class="save" onclick="openFoodModal()">Добавить блюдо</button>

<div id="foodsList"></div>

<button class="close" onclick="closeModal('foodsModal')">Закрыть</button>
</div>
</div>

<!-- Добавить блюдо -->
<div class="modal" id="foodModal">
<div class="modal-content">
<h2>Добавить блюдо</h2>

<input id="foodName" placeholder="Название блюда">
<input id="foodPrice" type="number" placeholder="Цена">

<button class="save" onclick="saveFood()">Сохранить</button>
<button class="close" onclick="closeModal('foodModal')">Закрыть</button>
</div>
</div>

<!-- Добавить вид -->
<div class="modal" id="typeModal">
<div class="modal-content">
<h2>Новый вид блюд</h2>

<input id="typeName" placeholder="Название вида">

<button class="save" onclick="saveType()">Создать</button>
<button class="close" onclick="closeModal('typeModal')">Закрыть</button>
</div>
</div>

<!-- Заказы -->
<div class="modal" id="ordersModal">
<div class="modal-content">
<h2>Все заказы</h2>

<div id="ordersList"></div>

<button class="close" onclick="closeModal('ordersModal')">Закрыть</button>
</div>
</div>

<!-- Настройки -->
<div class="modal" id="settingsModal">
<div class="modal-content">
<h2>История заказов</h2>

<div id="historyList"></div>

<button class="close" onclick="closeModal('settingsModal')">Закрыть</button>
</div>
</div>

<script>

let currentCategory = "";
let order = [];

let categories = JSON.parse(localStorage.getItem("categories")) || {
"Первое":[],
"Второе":[],
"Десерты":[],
"Напитки":[],
"Алкоголь":[]
};

let orders = JSON.parse(localStorage.getItem("orders")) || [];
let history = JSON.parse(localStorage.getItem("history")) || [];

function saveAll(){
localStorage.setItem("categories",JSON.stringify(categories));
localStorage.setItem("orders",JSON.stringify(orders));
localStorage.setItem("history",JSON.stringify(history));
}

function renderCategories(){
let box=document.getElementById("categories");
box.innerHTML="";

for(let cat in categories){

box.innerHTML+=`
<div class="category" onclick="openFoods('${cat}')">
${cat}

<div class="category-tools">
<button class="small-btn edit" onclick="event.stopPropagation();editCategory('${cat}')">✏</button>
<button class="small-btn delete" onclick="event.stopPropagation();deleteCategory('${cat}')">🗑</button>
</div>

</div>
`;
}
}

function openFoods(cat){
currentCategory=cat;
document.getElementById("foodsTitle").innerText=cat;

let list=document.getElementById("foodsList");
list.innerHTML="";

categories[cat].forEach((food,index)=>{

list.innerHTML+=`
<div class="food-card">
<h3>${food.name}</h3>
<p>${food.price} ₽</p>

<button class="save" onclick="addToOrder('${food.name}',${food.price})">Добавить</button>

<button class="edit" onclick="editFood(${index})">Редактировать</button>

<button class="delete" onclick="deleteFood(${index})">Удалить</button>
</div>
`;

});

document.getElementById("foodsModal").style.display="flex";
}

function openFoodModal(){
document.getElementById("foodModal").style.display="flex";
}

function saveFood(){

let name=document.getElementById("foodName").value;
let price=document.getElementById("foodPrice").value;

if(!name || !price) return;

categories[currentCategory].push({
name,
price
});

saveAll();

closeModal("foodModal");
openFoods(currentCategory);

document.getElementById("foodName").value="";
document.getElementById("foodPrice").value="";
}

function deleteFood(index){
categories[currentCategory].splice(index,1);
saveAll();
openFoods(currentCategory);
}

function editFood(index){

let newName=prompt("Новое название",categories[currentCategory][index].name);
let newPrice=prompt("Новая цена",categories[currentCategory][index].price);

if(newName && newPrice){

categories[currentCategory][index]={
name:newName,
price:newPrice
};

saveAll();
openFoods(currentCategory);

}
}

function addToOrder(name,price){

order.push({
name,
price
});

renderOrder();
}

function renderOrder(){

let box=document.getElementById("currentOrder");
box.innerHTML="";

let total=0;

order.forEach((item,index)=>{

total+=Number(item.price);

box.innerHTML+=`
<div class="order-item">
<span>${item.name} - ${item.price} ₽</span>

<button class="delete" onclick="removeOrderItem(${index})">X</button>
</div>
`;

});

document.getElementById("total").innerText=total+" ₽";
}

function removeOrderItem(index){
order.splice(index,1);
renderOrder();
}

function confirmOrder(){

if(order.length===0) return;

let table=document.getElementById("tableNumber").value || "Не указан";

let data={
table,
items:[...order],
total:document.getElementById("total").innerText,
time:new Date().toLocaleString()
};

orders.push(data);
history.push(data);

saveAll();

order=[];
renderOrder();

document.getElementById("tableNumber").value="";

alert("Заказ подтверждён");
}

function openOrders(){

let list=document.getElementById("ordersList");
list.innerHTML="";

orders.forEach((o,index)=>{

list.innerHTML+=`
<div class="history-card">

<h3>Столик: ${o.table}</h3>

<p>${o.time}</p>

<p>${o.items.map(i=>i.name).join(", ")}</p>

<h2>${o.total}</h2>

<button class="delete" onclick="deleteOrder(${index})">Удалить</button>

</div>
`;

});

document.getElementById("ordersModal").style.display="flex";
}

function deleteOrder(index){
orders.splice(index,1);
saveAll();
openOrders();
}

function openSettings(){

let list=document.getElementById("historyList");
list.innerHTML="";

history.forEach((o,index)=>{

list.innerHTML+=`
<div class="history-card">

<h3>Столик: ${o.table}</h3>

<p>${o.time}</p>

<p>${o.items.map(i=>i.name).join(", ")}</p>

<h2>${o.total}</h2>

<button class="delete" onclick="deleteHistory(${index})">Удалить навсегда</button>

</div>
`;

});

document.getElementById("settingsModal").style.display="flex";
}

function deleteHistory(index){
history.splice(index,1);
saveAll();
openSettings();
}

function openTypeModal(){
document.getElementById("typeModal").style.display="flex";
}

function saveType(){

let name=document.getElementById("typeName").value;

if(!name) return;

categories[name]=[];

saveAll();
renderCategories();

document.getElementById("typeName").value="";

closeModal("typeModal");
}

function deleteCategory(cat){

if(confirm("Удалить категорию?")){

delete categories[cat];

saveAll();
renderCategories();

}
}

function editCategory(cat){

let newName=prompt("Новое название",cat);

if(!newName) return;

categories[newName]=categories[cat];

delete categories[cat];

saveAll();
renderCategories();
}

function closeModal(id){
document.getElementById(id).style.display="none";
}

renderCategories();
renderOrder();

</script>

</body>
  </html>

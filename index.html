<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forest Restaurant PRO</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(90deg,#001a09,#003b12,#001a09);
color:white;
min-height:100vh;
padding:18px;
overflow-x:hidden;
}

/* HEADER */

.header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:25px;
}

.logo{
display:flex;
align-items:center;
gap:10px;
}

.logo h1{
font-size:48px;
}

.logo p{
color:#8fffd0;
font-size:18px;
}

.buttons{
display:flex;
gap:12px;
}

.top-btn{
border:none;
padding:18px 24px;
border-radius:22px;
font-size:20px;
font-weight:bold;
color:white;
cursor:pointer;
transition:0.3s;
}

.view-btn{
background:linear-gradient(45deg,#ff7a00,#ff2d55);
}

.orders-btn{
background:linear-gradient(45deg,#00bcd4,#2dd4bf);
}

.top-btn:hover{
transform:scale(1.05);
}

/* CATEGORIES */

.categories{
display:grid;
grid-template-columns:1fr 1fr;
gap:18px;
}

.category{
background:rgba(0,0,0,0.55);
border-radius:28px;
padding:40px 20px;
font-size:32px;
font-weight:bold;
cursor:pointer;
transition:0.3s;
}

.category:hover{
background:#123a24;
transform:translateY(-5px);
}

/* ORDER */

.order-box{
margin-top:30px;
background:rgba(0,0,0,0.6);
padding:25px;
border-radius:35px;
}

.order-box h2{
font-size:48px;
margin-bottom:20px;
}

.order-items{
margin-bottom:20px;
}

.order-item{
display:flex;
justify-content:space-between;
align-items:center;
background:#062615;
padding:12px;
border-radius:15px;
margin-bottom:10px;
font-size:20px;
}

.remove-btn{
background:red;
border:none;
padding:8px 14px;
border-radius:10px;
color:white;
cursor:pointer;
font-weight:bold;
}

.total{
display:flex;
justify-content:space-between;
font-size:30px;
font-weight:bold;
margin-top:20px;
margin-bottom:20px;
}

.accept-btn{
width:100%;
padding:26px;
border:none;
border-radius:30px;
background:#25d7c0;
color:white;
font-size:32px;
font-weight:bold;
cursor:pointer;
transition:0.3s;
}

.accept-btn:hover{
transform:scale(1.03);
}

/* MODAL */

.modal{
position:fixed;
inset:0;
background:rgba(0,0,0,0.8);
display:none;
justify-content:center;
align-items:center;
z-index:999;
padding:20px;
}

.modal-content{
background:#041b10;
width:100%;
max-width:500px;
padding:25px;
border-radius:25px;
max-height:80vh;
overflow:auto;
}

.modal-content h2{
margin-bottom:20px;
font-size:34px;
}

.product{
background:#0a2f1c;
padding:15px;
border-radius:18px;
margin-bottom:12px;
display:flex;
justify-content:space-between;
align-items:center;
font-size:20px;
}

.add-btn{
background:#22c55e;
border:none;
padding:10px 18px;
border-radius:12px;
color:white;
font-weight:bold;
cursor:pointer;
}

.close-btn{
margin-top:20px;
width:100%;
padding:15px;
border:none;
border-radius:15px;
background:#ff2d55;
color:white;
font-size:20px;
cursor:pointer;
}

/* ORDERS */

.history-order{
background:#0a2f1c;
padding:15px;
border-radius:18px;
margin-bottom:15px;
}

.history-order h3{
margin-bottom:10px;
}

/* MOBILE */

@media(max-width:700px){

.logo h1{
font-size:28px;
}

.category{
font-size:22px;
padding:28px 18px;
}

.order-box h2{
font-size:34px;
}

.accept-btn{
font-size:24px;
}

.top-btn{
font-size:17px;
padding:14px 18px;
}

}

</style>
</head>

<body>

<!-- HEADER -->

<div class="header">

<div class="logo">
<div style="font-size:48px;">🌲</div>

<div>
<h1>Forest</h1>
<p>Restaurant PRO</p>
</div>

</div>

<div class="buttons">

<button class="top-btn view-btn"
onclick="changeView()">
+ Вид
</button>

<button class="top-btn orders-btn"
onclick="openOrders()">
Заказы
</button>

</div>

</div>

<!-- CATEGORIES -->

<div class="categories">

<div class="category"
onclick="openCategory('Первое')">
Первое
</div>

<div class="category"
onclick="openCategory('Второе')">
Второе
</div>

<div class="category"
onclick="openCategory('Десерты')">
Десерты
</div>

<div class="category"
onclick="openCategory('Напитки')">
Напитки
</div>

<div class="category"
onclick="openCategory('Алкоголь')">
Алкоголь
</div>

</div>

<!-- ORDER BOX -->

<div class="order-box">

<h2>Текущий заказ</h2>

<div id="orderItems" class="order-items">
Нет блюд
</div>

<div class="total">
<span>Итого</span>
<span id="total">0 ₽</span>
</div>

<button class="accept-btn"
onclick="confirmOrder()">
Подтвердить заказ
</button>

</div>

<!-- PRODUCTS MODAL -->

<div class="modal" id="productsModal">

<div class="modal-content">

<h2 id="modalTitle">Категория</h2>

<div id="productsList"></div>

<button class="close-btn"
onclick="closeProducts()">
Закрыть
</button>

</div>

</div>

<!-- ORDERS MODAL -->

<div class="modal" id="ordersModal">

<div class="modal-content">

<h2>Все заказы</h2>

<div id="ordersHistory">
Пока заказов нет
</div>

<button class="close-btn"
onclick="closeOrders()">
Закрыть
</button>

</div>

</div>

<script>

let currentOrder = [];
let total = 0;
let allOrders = [];

let menu = {

"Первое":[
{name:"Борщ",price:450},
{name:"Суп",price:390},
{name:"Жаркое",price:700}
],

"Второе":[
{name:"Стейк",price:1200},
{name:"Курица",price:850},
{name:"Паста",price:650}
],

"Десерты":[
{name:"Торт",price:350},
{name:"Мороженое",price:250}
],

"Напитки":[
{name:"Лимонад",price:220},
{name:"Кофе",price:180}
],

"Алкоголь":[
{name:"Вино",price:1800},
{name:"Виски",price:2600}
]

};

function openCategory(category){

document.getElementById("productsModal").style.display="flex";

document.getElementById("modalTitle").innerText=category;

let html="";

menu[category].forEach(product=>{

html += `
<div class="product">

<div>
${product.name}<br>
${product.price} ₽
</div>

<button class="add-btn"
onclick="addProduct('${product.name}',${product.price})">
Добавить
</button>

</div>
`;

});

document.getElementById("productsList").innerHTML=html;

}

function closeProducts(){
document.getElementById("productsModal").style.display="none";
}

function addProduct(name,price){

currentOrder.push({name,price});

total += price;

renderOrder();

}

function renderOrder(){

let container=document.getElementById("orderItems");

if(currentOrder.length===0){

container.innerHTML="Нет блюд";

}else{

container.innerHTML="";

currentOrder.forEach((item,index)=>{

container.innerHTML += `
<div class="order-item">

<div>
${item.name} — ${item.price} ₽
</div>

<button class="remove-btn"
onclick="removeProduct(${index})">
X
</button>

</div>
`;

});

}

document.getElementById("total").innerText=total+" ₽";

}

function removeProduct(index){

total -= currentOrder[index].price;

currentOrder.splice(index,1);

renderOrder();

}

function confirmOrder(){

if(currentOrder.length===0){

alert("Добавьте блюда");

return;

}

let time = new Date().toLocaleTimeString();

allOrders.push({
time:time,
items:[...currentOrder],
total:total
});

alert("Заказ подтвержден!");

currentOrder=[];
total=0;

renderOrder();

}

function openOrders(){

document.getElementById("ordersModal").style.display="flex";

let html="";

if(allOrders.length===0){

html="Пока заказов нет";

}else{

allOrders.forEach((order,index)=>{

html += `
<div class="history-order">

<h3>
Заказ #${index+1}
</h3>

<p>
Время: ${order.time}
</p>

<br>

${order.items.map(i=>
`${i.name} — ${i.price} ₽`
).join("<br>")}

<br><br>

<b>
Итого: ${order.total} ₽
</b>

</div>
`;

});

}

document.getElementById("ordersHistory").innerHTML=html;

}

function closeOrders(){
document.getElementById("ordersModal").style.display="none";
}

function changeView(){

let views=[
"linear-gradient(90deg,#001a09,#003b12,#001a09)",
"linear-gradient(90deg,#111827,#1f2937,#111827)",
"linear-gradient(90deg,#1a0020,#3b0764,#1a0020)"
];

let random=views[Math.floor(Math.random()*views.length)];

document.body.style.background=random;

}

</script>

</body>
</html>

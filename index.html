<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forest Restaurant PRO</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(180deg,#021b12,#05361d);
color:white;
min-height:100vh;
padding:20px;
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
}

.logo{
display:flex;
align-items:center;
gap:15px;
}

.logo h1{
font-size:42px;
}

.logo p{
color:#8fffd2;
}

.top-buttons{
display:flex;
gap:10px;
align-items:center;
}

.btn{
border:none;
border-radius:18px;
padding:15px 20px;
font-weight:bold;
font-size:18px;
cursor:pointer;
}

.orange{
background:linear-gradient(45deg,#ff7b00,#ff3d77);
color:white;
}

.blue{
background:linear-gradient(45deg,#00d2ff,#3a7dff);
color:white;
}

.settings{
width:55px;
height:55px;
border-radius:50%;
background:#081321;
color:white;
font-size:26px;
display:flex;
justify-content:center;
align-items:center;
cursor:pointer;
}

.categories{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
margin-bottom:25px;
}

.category{
background:rgba(0,0,0,0.35);
border-radius:25px;
padding:30px 20px;
font-size:26px;
font-weight:bold;
cursor:pointer;
transition:0.2s;
position:relative;
}

.category:hover{
transform:scale(1.03);
}

.category-actions{
position:absolute;
top:10px;
right:10px;
display:flex;
gap:5px;
}

.small-btn{
border:none;
padding:5px 8px;
border-radius:10px;
cursor:pointer;
font-size:12px;
}

.edit{
background:#00d5ff;
color:white;
}

.delete{
background:#ff4d7a;
color:white;
}

.order-box{
background:rgba(0,0,0,0.45);
border-radius:30px;
padding:25px;
}

.order-box h2{
font-size:48px;
margin-bottom:20px;
}

.table-input{
width:100%;
padding:15px;
border:none;
border-radius:15px;
margin-bottom:15px;
font-size:18px;
}

.order-item{
display:flex;
justify-content:space-between;
align-items:center;
background:rgba(255,255,255,0.05);
padding:12px;
border-radius:12px;
margin-bottom:10px;
}

.remove-btn{
background:#ff4d7a;
border:none;
color:white;
padding:6px 10px;
border-radius:10px;
cursor:pointer;
}

.total{
display:flex;
justify-content:space-between;
font-size:36px;
font-weight:bold;
margin:20px 0;
}

.confirm{
width:100%;
padding:22px;
border:none;
border-radius:22px;
font-size:32px;
font-weight:bold;
background:linear-gradient(45deg,#00ffc8,#49e2ff);
color:white;
cursor:pointer;
}

.modal{
position:fixed;
inset:0;
background:rgba(0,0,0,0.7);
display:none;
justify-content:center;
align-items:center;
padding:20px;
z-index:1000;
}

.modal-content{
background:#062416;
width:100%;
max-width:500px;
border-radius:25px;
padding:20px;
max-height:90vh;
overflow:auto;
}

.modal h2{
margin-bottom:20px;
font-size:34px;
}

input{
width:100%;
padding:14px;
border:none;
border-radius:14px;
margin-bottom:12px;
font-size:18px;
}

.save-btn{
width:100%;
padding:14px;
border:none;
border-radius:14px;
background:#43ff68;
font-size:20px;
font-weight:bold;
margin-bottom:10px;
cursor:pointer;
}

.close-btn{
width:100%;
padding:14px;
border:none;
border-radius:14px;
background:#ff4d7a;
font-size:20px;
font-weight:bold;
color:white;
cursor:pointer;
}

.food-item{
background:rgba(255,255,255,0.05);
padding:14px;
border-radius:18px;
margin-bottom:10px;
}

.food-top{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:10px;
}

.food-title{
font-size:22px;
font-weight:bold;
}

.food-price{
color:#aaffdc;
}

.food-buttons{
display:flex;
gap:8px;
}

.food-buttons button{
flex:1;
padding:10px;
border:none;
border-radius:12px;
font-weight:bold;
cursor:pointer;
}

.add-food{
background:#4dff88;
}

.edit-food{
background:#4ddcff;
}

.delete-food{
background:#ff4d7a;
color:white;
}

.history-card{
background:rgba(255,255,255,0.05);
padding:15px;
border-radius:18px;
margin-bottom:15px;
}

.history-card h3{
margin-bottom:10px;
}

</style>
</head>
<body>

<div class="header">

<div class="logo">
<div style="font-size:60px">🌲</div>
<div>
<h1>Forest</h1>
<p>Restaurant PRO</p>
</div>
</div>

<div class="top-buttons">
<button class="btn orange" onclick="openCategoryCreator()">+ Вид</button>
<button class="btn blue" onclick="openOrders()">Заказы</button>
<div class="settings" onclick="openSettings()">⚙</div>
</div>

</div>

<div class="categories" id="categories"></div>

<div class="order-box">

<h2>Текущий заказ</h2>

<input class="table-input" id="tableNumber" placeholder="Номер столика">

<div id="orderList"></div>

<div class="total">
<span>Итого</span>
<span id="total">0 ₽</span>
</div>

<button class="confirm" onclick="confirmOrder()">Подтвердить заказ</button>

</div>

<!-- CATEGORY MODAL -->

<div class="modal" id="foodsModal">

<div class="modal-content">

<h2 id="foodsTitle"></h2>

<button class="save-btn" onclick="showAddFood()">Добавить блюдо</button>

<div id="foodsList"></div>

<button class="close-btn" onclick="closeModal('foodsModal')">Закрыть</button>

</div>
</div>

<!-- ADD FOOD -->

<div class="modal" id="addFoodModal">

<div class="modal-content">

<h2>Добавить блюдо</h2>

<input id="foodName" placeholder="Название блюда">
<input id="foodPrice" type="number" placeholder="Цена">

<button class="save-btn" onclick="saveFood()">Сохранить</button>

<button class="close-btn" onclick="closeModal('addFoodModal')">Закрыть</button>

</div>
</div>

<!-- CATEGORY CREATE -->

<div class="modal" id="categoryModal">

<div class="modal-content">

<h2>Новый вид блюда</h2>

<input id="categoryName" placeholder="Название вида">

<button class="save-btn" onclick="saveCategory()">Создать</button>

<button class="close-btn" onclick="closeModal('categoryModal')">Закрыть</button>

</div>
</div>

<!-- ORDERS -->

<div class="modal" id="ordersModal">

<div class="modal-content">

<h2>Активные заказы</h2>

<div id="ordersList"></div>

<button class="close-btn" onclick="closeModal('ordersModal')">Закрыть</button>

</div>
</div>

<!-- SETTINGS -->

<div class="modal" id="settingsModal">

<div class="modal-content">

<h2>История заказов</h2>

<div id="historyList"></div>

<button class="close-btn" onclick="closeModal('settingsModal')">Закрыть</button>

</div>
</div>

<script>

let categories = JSON.parse(localStorage.getItem("categories")) || [
{name:"Первое", foods:[]},
{name:"Второе", foods:[]},
{name:"Десерты", foods:[]},
{name:"Напитки", foods:[]},
{name:"Алкоголь", foods:[]}
];

let currentOrder = JSON.parse(localStorage.getItem("currentOrder")) || [];

let orders = JSON.parse(localStorage.getItem("orders")) || [];

let history = JSON.parse(localStorage.getItem("history")) || [];

let currentCategory = null;
let editFoodIndex = null;

function saveData(){
localStorage.setItem("categories",JSON.stringify(categories));
localStorage.setItem("currentOrder",JSON.stringify(currentOrder));
localStorage.setItem("orders",JSON.stringify(orders));
localStorage.setItem("history",JSON.stringify(history));
}

function renderCategories(){

const box = document.getElementById("categories");
box.innerHTML = "";

categories.forEach((cat,index)=>{

box.innerHTML += `
<div class="category" onclick="openFoods(${index})">

<div class="category-actions">

<button class="small-btn edit" onclick="event.stopPropagation(); editCategory(${index})">✏</button>

<button class="small-btn delete" onclick="event.stopPropagation(); deleteCategory(${index})">🗑</button>

</div>

${cat.name}

</div>
`;

});

}

function openFoods(index){

currentCategory = index;

document.getElementById("foodsTitle").innerText = categories[index].name;

const list = document.getElementById("foodsList");

list.innerHTML = "";

categories[index].foods.forEach((food,i)=>{

list.innerHTML += `
<div class="food-item">

<div class="food-top">
<div>
<div class="food-title">${food.name}</div>
<div class="food-price">${food.price} ₽</div>
</div>
</div>

<div class="food-buttons">

<button class="add-food" onclick="addToOrder('${food.name}',${food.price})">+</button>

<button class="edit-food" onclick="editFood(${i})">✏</button>

<button class="delete-food" onclick="deleteFood(${i})">🗑</button>

</div>

</div>
`;

});

document.getElementById("foodsModal").style.display = "flex";

}

function showAddFood(){

editFoodIndex = null;

document.getElementById("foodName").value = "";
document.getElementById("foodPrice").value = "";

document.getElementById("addFoodModal").style.display = "flex";

}

function saveFood(){

const name = document.getElementById("foodName").value;
const price = document.getElementById("foodPrice").value;

if(!name || !price) return;

if(editFoodIndex === null){

categories[currentCategory].foods.push({
name,
price
});

}else{

categories[currentCategory].foods[editFoodIndex] = {
name,
price
};

}

saveData();

closeModal("addFoodModal");

openFoods(currentCategory);

renderCategories();

}

function editFood(index){

editFoodIndex = index;

const food = categories[currentCategory].foods[index];

document.getElementById("foodName").value = food.name;
document.getElementById("foodPrice").value = food.price;

document.getElementById("addFoodModal").style.display = "flex";

}

function deleteFood(index){

categories[currentCategory].foods.splice(index,1);

saveData();

openFoods(currentCategory);

}

function addToOrder(name,price){

currentOrder.push({name,price});

saveData();

renderOrder();

}

function renderOrder(){

const list = document.getElementById("orderList");

list.innerHTML = "";

let total = 0;

currentOrder.forEach((item,index)=>{

total += Number(item.price);

list.innerHTML += `
<div class="order-item">

<div>
${item.name}<br>
${item.price} ₽
</div>

<button class="remove-btn" onclick="removeOrderItem(${index})">X</button>

</div>
`;

});

document.getElementById("total").innerText = total + " ₽";

}

function removeOrderItem(index){

currentOrder.splice(index,1);

saveData();

renderOrder();

}

function confirmOrder(){

if(currentOrder.length === 0) return;

const order = {
table: document.getElementById("tableNumber").value || "Без номера",
items:[...currentOrder],
total: currentOrder.reduce((a,b)=>a+Number(b.price),0),
date:new Date().toLocaleString()
};

orders.push(order);
history.push(order);

currentOrder = [];

document.getElementById("tableNumber").value = "";

saveData();

renderOrder();

alert("Заказ принят");

}

function openOrders(){

const list = document.getElementById("ordersList");

list.innerHTML = "";

orders.forEach((order,index)=>{

list.innerHTML += `
<div class="history-card">

<h3>Столик: ${order.table}</h3>

<div>${order.date}</div>

<br>

${order.items.map(i=>`${i.name} - ${i.price} ₽`).join("<br>")}

<br><br>

<b>Итого: ${order.total} ₽</b>

<br><br>

<button class="save-btn" onclick="deleteOrder(${index})">Удалить</button>

</div>
`;

});

document.getElementById("ordersModal").style.display = "flex";

}

function deleteOrder(index){

orders.splice(index,1);

saveData();

openOrders();

}

function openSettings(){

const list = document.getElementById("historyList");

list.innerHTML = "";

history.forEach((order,index)=>{

list.innerHTML += `
<div class="history-card">

<h3>Столик ${order.table}</h3>

<div>${order.date}</div>

<br>

${order.items.map(i=>`${i.name} - ${i.price} ₽`).join("<br>")}

<br><br>

<b>Итого: ${order.total} ₽</b>

<br><br>

<button class="close-btn" onclick="deleteHistory(${index})">Удалить навсегда</button>

</div>
`;

});

document.getElementById("settingsModal").style.display = "flex";

}

function deleteHistory(index){

history.splice(index,1);

saveData();

openSettings();

}

function openCategoryCreator(){

document.getElementById("categoryModal").style.display = "flex";

}

function saveCategory(){

const name = document.getElementById("categoryName").value;

if(!name) return;

categories.push({
name,
foods:[]
});

saveData();

renderCategories();

closeModal("categoryModal");

document.getElementById("categoryName").value = "";

}

function deleteCategory(index){

if(confirm("Удалить категорию?")){

categories.splice(index,1);

saveData();

renderCategories();

}

}

function editCategory(index){

const newName = prompt("Новое название",categories[index].name);

if(newName){

categories[index].name = newName;

saveData();

renderCategories();

}

}

function closeModal(id){

document.getElementById(id).style.display = "none";

}

renderCategories();

renderOrder();

</script>

</body>
</html>

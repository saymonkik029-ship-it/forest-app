<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forest Restaurant PRO</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:linear-gradient(90deg,#001b08,#0d4f1f,#001b08);
color:white;
padding:20px;
}

header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:25px;
}

.logo{
display:flex;
align-items:center;
gap:15px;
}

.logo h1{
font-size:52px;
}

.logo p{
color:#8fffd1;
font-size:24px;
}

.top-buttons{
display:flex;
gap:15px;
align-items:center;
}

.top-btn{
border:none;
padding:18px 30px;
border-radius:25px;
font-size:22px;
font-weight:bold;
cursor:pointer;
color:white;
}

.orange{
background:linear-gradient(45deg,#ff7b00,#ff3c7b);
}

.blue{
background:linear-gradient(45deg,#00cfff,#27e2c2);
}

.settings{
width:65px;
height:65px;
border-radius:50%;
border:none;
font-size:30px;
cursor:pointer;
background:#111;
color:white;
}

.categories{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
margin-bottom:30px;
}

.category{
background:rgba(0,0,0,0.45);
border-radius:35px;
padding:40px 25px;
font-size:42px;
font-weight:bold;
cursor:pointer;
transition:0.2s;
}

.category:hover{
transform:scale(1.03);
}

.order-box{
background:rgba(0,0,0,0.45);
border-radius:35px;
padding:25px;
}

.order-box h2{
font-size:55px;
margin-bottom:20px;
}

.table-input{
width:100%;
padding:18px;
border:none;
border-radius:15px;
font-size:22px;
margin-bottom:20px;
}

.order-item{
background:rgba(255,255,255,0.08);
padding:15px;
border-radius:15px;
margin-bottom:10px;
display:flex;
justify-content:space-between;
align-items:center;
font-size:20px;
}

.remove-btn{
background:#ff4d73;
border:none;
color:white;
padding:8px 14px;
border-radius:10px;
cursor:pointer;
}

.total{
font-size:38px;
font-weight:bold;
margin-top:20px;
display:flex;
justify-content:space-between;
}

.confirm{
margin-top:20px;
width:100%;
padding:22px;
border:none;
border-radius:25px;
font-size:34px;
font-weight:bold;
background:linear-gradient(45deg,#22e7b6,#2fe1ff);
color:white;
cursor:pointer;
}

.modal{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.7);
display:none;
justify-content:center;
align-items:center;
padding:20px;
z-index:999;
}

.modal-content{
background:#071d10;
width:100%;
max-width:850px;
max-height:90vh;
overflow:auto;
border-radius:30px;
padding:25px;
}

.modal h2{
font-size:45px;
margin-bottom:20px;
}

.add-dish{
width:100%;
padding:18px;
border:none;
border-radius:18px;
background:#4cff6f;
font-size:28px;
font-weight:bold;
margin-bottom:20px;
cursor:pointer;
}

.dish-card{
background:rgba(255,255,255,0.05);
padding:15px;
border-radius:20px;
margin-bottom:15px;
display:flex;
justify-content:space-between;
align-items:center;
}

.dish-info h3{
font-size:28px;
}

.dish-info p{
font-size:20px;
margin-top:5px;
color:#ccc;
}

.actions{
display:flex;
gap:10px;
}

.mini{
width:48px;
height:48px;
border:none;
border-radius:12px;
font-size:24px;
font-weight:bold;
cursor:pointer;
color:white;
}

.green{
background:#39ff7a;
}

.cyan{
background:#4bdfff;
}

.red{
background:#ff4d73;
}

.close{
width:100%;
padding:18px;
margin-top:15px;
border:none;
border-radius:18px;
background:#ff4d73;
color:white;
font-size:24px;
font-weight:bold;
cursor:pointer;
}

.order-history{
background:rgba(255,255,255,0.05);
padding:15px;
border-radius:20px;
margin-bottom:15px;
}

.order-history h3{
margin-bottom:10px;
}

input{
outline:none;
}
</style>
</head>

<body>

<header>

<div class="logo">
<div>
<h1>🌲 Forest</h1>
<p>Restaurant PRO</p>
</div>
</div>

<div class="top-buttons">
<button class="top-btn orange" onclick="addCategory()">+ Вид</button>
<button class="top-btn blue" onclick="openOrders()">Заказы</button>
<button class="settings" onclick="openSettings()">⚙</button>
</div>

</header>

<div class="categories" id="categories"></div>

<div class="order-box">

<h2>Текущий заказ</h2>

<input type="number" placeholder="Номер столика" id="tableNumber" class="table-input">

<div id="orderItems"></div>

<div class="total">
<span>Итого</span>
<span id="totalPrice">0 ₽</span>
</div>

<button class="confirm" onclick="confirmOrder()">
Подтвердить заказ
</button>

</div>

<!-- МЕНЮ -->
<div class="modal" id="menuModal">
<div class="modal-content">

<h2 id="menuTitle"></h2>

<button class="add-dish" onclick="createDish()">
+ Добавить блюдо
</button>

<div id="dishList"></div>

<button class="close" onclick="closeModal('menuModal')">
Закрыть
</button>

</div>
</div>

<!-- ЗАКАЗЫ -->
<div class="modal" id="ordersModal">
<div class="modal-content">

<h2>Все заказы</h2>

<div id="ordersList"></div>

<button class="close" onclick="closeModal('ordersModal')">
Закрыть
</button>

</div>
</div>

<!-- НАСТРОЙКИ -->
<div class="modal" id="settingsModal">
<div class="modal-content">

<h2>История заказов</h2>

<div id="historyList"></div>

<button class="close" onclick="closeModal('settingsModal')">
Закрыть
</button>

</div>
</div>

<script>

let categories = JSON.parse(localStorage.getItem("categories")) || {
"Первое":[
{name:"Борщ",price:250}
],
"Второе":[
{name:"Стейк",price:550}
],
"Десерты":[
{name:"Чизкейк",price:200}
],
"Напитки":[
{name:"Кола",price:120}
],
"Алкоголь":[
{name:"Вино",price:700}
]
};

let currentCategory = "";
let currentOrder = [];
let orders = JSON.parse(localStorage.getItem("orders")) || [];
let history = JSON.parse(localStorage.getItem("history")) || [];

function save(){
localStorage.setItem("categories",JSON.stringify(categories));
localStorage.setItem("orders",JSON.stringify(orders));
localStorage.setItem("history",JSON.stringify(history));
}

function renderCategories(){

let box=document.getElementById("categories");
box.innerHTML="";

for(let category in categories){

box.innerHTML+=`
<div class="category" onclick="openCategory('${category}')">
${category}
</div>
`;

}

}

function openCategory(name){

currentCategory=name;

document.getElementById("menuTitle").innerText=name;

let list=document.getElementById("dishList");
list.innerHTML="";

categories[name].forEach((dish,index)=>{

list.innerHTML+=`
<div class="dish-card">

<div class="dish-info">
<h3>${dish.name}</h3>
<p>${dish.price} ₽</p>
</div>

<div class="actions">

<button class="mini green"
onclick="addToOrder('${dish.name}',${dish.price})">
+
</button>

<button class="mini cyan"
onclick="editDish(${index})">
✎
</button>

<button class="mini red"
onclick="deleteDish(${index})">
×
</button>

</div>

</div>
`;

});

document.getElementById("menuModal").style.display="flex";

}

function closeModal(id){
document.getElementById(id).style.display="none";
}

function createDish(){

let name=prompt("Название блюда");
if(!name)return;

let price=prompt("Цена");
if(!price)return;

categories[currentCategory].push({
name,
price:Number(price)
});

save();
openCategory(currentCategory);

}

function editDish(index){

let dish=categories[currentCategory][index];

let newName=prompt("Новое название",dish.name);
if(!newName)return;

let newPrice=prompt("Новая цена",dish.price);
if(!newPrice)return;

dish.name=newName;
dish.price=Number(newPrice);

save();
openCategory(currentCategory);

}

function deleteDish(index){

if(confirm("Удалить блюдо?")){

categories[currentCategory].splice(index,1);

save();
openCategory(currentCategory);

}

}

function addCategory(){

let name=prompt("Название категории");

if(!name)return;

categories[name]=[];

save();
renderCategories();

}

function addToOrder(name,price){

currentOrder.push({
name,
price
});

renderOrder();

}

function renderOrder(){

let box=document.getElementById("orderItems");
box.innerHTML="";

let total=0;

currentOrder.forEach((item,index)=>{

total+=item.price;

box.innerHTML+=`
<div class="order-item">

<div>
${item.name} — ${item.price} ₽
</div>

<button class="remove-btn"
onclick="removeOrderItem(${index})">
Удалить
</button>

</div>
`;

});

document.getElementById("totalPrice").innerText=
total+" ₽";

}

function removeOrderItem(index){

currentOrder.splice(index,1);

renderOrder();

}

function confirmOrder(){

if(currentOrder.length===0){
alert("Нет блюд");
return;
}

let table=document.getElementById("tableNumber").value;

let total=currentOrder.reduce((a,b)=>a+b.price,0);

let order={
id:Date.now(),
table:table,
items:[...currentOrder],
total:total,
date:new Date().toLocaleString()
};

orders.push(order);
history.push(order);

save();

currentOrder=[];
renderOrder();

document.getElementById("tableNumber").value="";

alert("Заказ принят");

}

function openOrders(){

let list=document.getElementById("ordersList");
list.innerHTML="";

orders.forEach((order,index)=>{

list.innerHTML+=`
<div class="order-history">

<h3>Столик: ${order.table}</h3>

<p>${order.date}</p>

<p>
${order.items.map(i=>i.name).join(", ")}
</p>

<h3>${order.total} ₽</h3>

<div style="margin-top:10px;display:flex;gap:10px;">

<button class="mini cyan"
onclick="editOrder(${index})">
✎
</button>

<button class="mini red"
onclick="deleteOrder(${index})">
×
</button>

</div>

</div>
`;

});

document.getElementById("ordersModal").style.display="flex";

}

function deleteOrder(index){

orders.splice(index,1);

save();
openOrders();

}

function editOrder(index){

alert("Редактирование можно добавить позже");

}

function openSettings(){

let list=document.getElementById("historyList");
list.innerHTML="";

history.forEach((order,index)=>{

list.innerHTML+=`
<div class="order-history">

<h3>Столик: ${order.table}</h3>

<p>${order.date}</p>

<p>
${order.items.map(i=>i.name).join(", ")}
</p>

<h3>${order.total} ₽</h3>

<button class="mini red"
onclick="deleteHistory(${index})">
×
</button>

</div>
`;

});

document.getElementById("settingsModal").style.display="flex";

}

function deleteHistory(index){

history.splice(index,1);

save();
openSettings();

}

renderCategories();

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Forest Restaurant PRO</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:
linear-gradient(rgba(0,0,0,.65),rgba(0,0,0,.7)),
linear-gradient(135deg,#013b12,#045b1c,#01280c);
color:white;
min-height:100vh;
padding:20px;
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:25px;
}

.logo{
display:flex;
align-items:center;
gap:12px;
}

.logo h1{
font-size:52px;
}

.logo p{
color:#7dffb2;
font-size:22px;
}

.top-buttons{
display:flex;
gap:10px;
align-items:center;
}

.btn{
border:none;
cursor:pointer;
font-weight:bold;
}

.btn-main{
padding:14px 24px;
border-radius:18px;
font-size:18px;
color:white;
}

.orange{
background:linear-gradient(45deg,#ff6a00,#ff4d6d);
}

.blue{
background:linear-gradient(45deg,#00b4ff,#32d7b8);
}

.settings{
width:42px;
height:42px;
border-radius:50%;
background:#111827;
color:white;
font-size:20px;
}

.categories{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:18px;
margin-bottom:30px;
}

.category{
background:rgba(0,0,0,.45);
border-radius:24px;
padding:30px;
font-size:22px;
font-weight:bold;
cursor:pointer;
transition:.2s;
position:relative;
}

.category:hover{
transform:scale(1.03);
}

.cat-actions{
position:absolute;
top:10px;
right:10px;
display:flex;
gap:5px;
}

.small-btn{
width:28px;
height:28px;
border:none;
border-radius:8px;
cursor:pointer;
font-size:14px;
font-weight:bold;
color:white;
}

.edit{
background:#00b4ff;
}

.delete{
background:#ff4d6d;
}

.order-box{
background:rgba(0,0,0,.45);
padding:25px;
border-radius:28px;
}

.order-box h2{
font-size:44px;
margin-bottom:20px;
}

.table-input{
width:100%;
padding:14px;
border-radius:14px;
border:none;
margin-bottom:20px;
font-size:18px;
}

.order-item{
display:flex;
justify-content:space-between;
align-items:center;
background:rgba(255,255,255,.08);
padding:12px;
border-radius:14px;
margin-bottom:10px;
}

.remove-item{
background:#ff4d6d;
border:none;
color:white;
padding:6px 10px;
border-radius:8px;
cursor:pointer;
}

.total{
display:flex;
justify-content:space-between;
font-size:40px;
font-weight:bold;
margin-top:20px;
}

.confirm{
width:100%;
margin-top:20px;
padding:18px;
border:none;
border-radius:22px;
background:linear-gradient(45deg,#00ffc3,#5ce1ff);
font-size:28px;
font-weight:bold;
color:white;
cursor:pointer;
}

.modal{
position:fixed;
inset:0;
background:rgba(0,0,0,.7);
display:none;
justify-content:center;
align-items:center;
padding:20px;
z-index:999;
}

.modal-content{
width:100%;
max-width:600px;
max-height:90vh;
overflow:auto;
background:#07150d;
padding:20px;
border-radius:24px;
}

.modal h2{
margin-bottom:20px;
font-size:34px;
}

.food-card{
background:rgba(255,255,255,.06);
padding:14px;
border-radius:18px;
margin-bottom:12px;
}

.food-top{
display:flex;
justify-content:space-between;
align-items:center;
}

.food-buttons{
display:flex;
gap:8px;
margin-top:12px;
}

.food-buttons button{
flex:1;
padding:10px;
border:none;
border-radius:12px;
font-weight:bold;
cursor:pointer;
color:white;
}

.add{
background:#38ef7d;
color:black !important;
}

.close{
background:#ff4d6d;
margin-top:15px;
width:100%;
padding:14px;
border:none;
border-radius:16px;
font-size:18px;
color:white;
cursor:pointer;
}

input{
width:100%;
padding:12px;
border:none;
border-radius:12px;
margin-bottom:12px;
font-size:16px;
}

.save{
width:100%;
padding:12px;
border:none;
border-radius:12px;
background:#38ef7d;
font-weight:bold;
cursor:pointer;
margin-bottom:10px;
}
</style>
</head>

<body>

<div class="header">
<div class="logo">
<div style="font-size:55px;">🌲</div>
<div>
<h1>Forest</h1>
<p>Restaurant PRO</p>
</div>
</div>

<div class="top-buttons">
<button class="btn btn-main orange" onclick="addCategory()">+ Вид</button>
<button class="btn btn-main blue" onclick="openOrders()">Заказы</button>
<button class="btn settings" onclick="openSettings()">⚙</button>
</div>
</div>

<div class="categories" id="categories"></div>

<div class="order-box">
<h2>Текущий заказ</h2>

<input class="table-input" id="tableNumber" placeholder="Номер столика">

<div id="currentOrder"></div>

<div class="total">
<span>Итого</span>
<span id="totalPrice">0 ₽</span>
</div>

<button class="confirm" onclick="confirmOrder()">
Подтвердить заказ
</button>
</div>

<!-- МОДАЛКА -->
<div class="modal" id="modal">
<div class="modal-content" id="modalContent"></div>
</div>

<script>
let categories = JSON.parse(localStorage.getItem("categories")) || {
"Первое":[],
"Второе":[],
"Десерты":[],
"Напитки":[],
"Алкоголь":[]
};

let currentOrder = [];
let orders = JSON.parse(localStorage.getItem("orders")) || [];
let history = JSON.parse(localStorage.getItem("history")) || [];

function save(){
localStorage.setItem("categories",JSON.stringify(categories));
localStorage.setItem("orders",JSON.stringify(orders));
localStorage.setItem("history",JSON.stringify(history));
}

function renderCategories(){
const box=document.getElementById("categories");
box.innerHTML="";

Object.keys(categories).forEach(cat=>{

box.innerHTML+=`
<div class="category" onclick="openCategory('${cat}')">
${cat}

<div class="cat-actions" onclick="event.stopPropagation()">
<button class="small-btn edit" onclick="renameCategory('${cat}')">✎</button>
<button class="small-btn delete" onclick="deleteCategory('${cat}')">✕</button>
</div>

</div>
`;

});
}

function addCategory(){
const name=prompt("Название вида");
if(!name)return;
categories[name]=[];
save();
renderCategories();
}

function renameCategory(oldName){
const newName=prompt("Новое название",oldName);
if(!newName)return;

categories[newName]=categories[oldName];
delete categories[oldName];

save();
renderCategories();
}

function deleteCategory(name){
if(confirm("Удалить вид?")){
delete categories[name];
save();
renderCategories();
}
}

function openCategory(name){

let html=`
<h2>${name}</h2>

<button class="save" onclick="addFood('${name}')">
+ Добавить блюдо
</button>
`;

categories[name].forEach((food,index)=>{

html+=`
<div class="food-card">

<div class="food-top">
<div>
<h3>${food.name}</h3>
<p>${food.price} ₽</p>
</div>

<div style="display:flex;gap:6px;">
<button class="small-btn add"
onclick="orderFood('${name}',${index})">+</button>

<button class="small-btn edit"
onclick="editFood('${name}',${index})">✎</button>

<button class="small-btn delete"
onclick="deleteFood('${name}',${index})">✕</button>
</div>
</div>

</div>
`;

});

html+=`
<button class="close" onclick="closeModal()">Закрыть</button>
`;

document.getElementById("modalContent").innerHTML=html;
document.getElementById("modal").style.display="flex";
}

function addFood(cat){

const name=prompt("Название блюда");
if(!name)return;

const price=prompt("Цена");
if(!price)return;

categories[cat].push({
name,
price:Number(price)
});

save();
openCategory(cat);
}

function editFood(cat,index){

let food=categories[cat][index];

const newName=prompt("Название",food.name);
if(!newName)return;

const newPrice=prompt("Цена",food.price);
if(!newPrice)return;

food.name=newName;
food.price=Number(newPrice);

save();
openCategory(cat);
}

function deleteFood(cat,index){
categories[cat].splice(index,1);
save();
openCategory(cat);
}

function orderFood(cat,index){

const food=categories[cat][index];

currentOrder.push(food);

renderOrder();
}

function renderOrder(){

const box=document.getElementById("currentOrder");

if(currentOrder.length===0){
box.innerHTML="<p>Нет блюд</p>";
document.getElementById("totalPrice").innerText="0 ₽";
return;
}

box.innerHTML="";

let total=0;

currentOrder.forEach((item,index)=>{

total+=item.price;

box.innerHTML+=`
<div class="order-item">
<div>
<b>${item.name}</b><br>
${item.price} ₽
</div>

<button class="remove-item"
onclick="removeOrderItem(${index})">
✕
</button>
</div>
`;

});

document.getElementById("totalPrice").innerText=
total+" ₽";
}

function removeOrderItem(index){
currentOrder.splice(index,1);
renderOrder();
}

function confirmOrder(){

if(currentOrder.length===0){
alert("Нет блюд");
return;
}

const table=document.getElementById("tableNumber").value || "Не указан";

const order={
table,
items:[...currentOrder],
total:currentOrder.reduce((a,b)=>a+b.price,0),
time:new Date().toLocaleString()
};

orders.push(order);
history.push(order);

save();

currentOrder=[];
renderOrder();

alert("Заказ принят");
}

function openOrders(){

let html=`<h2>Заказы</h2>`;

if(orders.length===0){
html+=`<p>Нет заказов</p>`;
}

orders.forEach((o,index)=>{

html+=`
<div class="food-card">

<h3>Столик: ${o.table}</h3>
<p>${o.time}</p>

<p>
${o.items.map(i=>i.name).join(", ")}
</p>

<b>${o.total} ₽</b>

<div class="food-buttons">
<button class="add"
onclick="deleteOrder(${index})">
Удалить
</button>
</div>

</div>
`;

});

html+=`
<button class="close" onclick="closeModal()">
Закрыть
</button>
`;

document.getElementById("modalContent").innerHTML=html;
document.getElementById("modal").style.display="flex";
}

function deleteOrder(index){
orders.splice(index,1);
save();
openOrders();
}

function openSettings(){

let html=`<h2>История заказов</h2>`;

history.forEach((o,index)=>{

html+=`
<div class="food-card">

<h3>Столик ${o.table}</h3>

<p>${o.time}</p>

<p>${o.items.map(i=>i.name).join(", ")}</p>

<b>${o.total} ₽</b>

<div class="food-buttons">
<button class="delete"
onclick="deleteHistory(${index})">
Удалить
</button>
</div>

</div>
`;

});

html+=`
<button class="close" onclick="closeModal()">
Закрыть
</button>
`;

document.getElementById("modalContent").innerHTML=html;
document.getElementById("modal").style.display="flex";
}

function deleteHistory(index){
history.splice(index,1);
save();
openSettings();
}

function closeModal(){
document.getElementById("modal").style.display="none";
}

renderCategories();
renderOrder();
</script>

</body>
</html>

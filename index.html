<!-- ДОБАВЬ ВНУТРИ .header -->
<button class="settings-top" onclick="openSettings()">⚙️</button>

<style>

.settings-top{
position:absolute;
top:20px;
right:20px;
width:55px;
height:55px;
border:none;
border-radius:50%;
background:#101728;
color:white;
font-size:26px;
cursor:pointer;
box-shadow:0 0 15px rgba(0,0,0,0.4);
z-index:999;
}

.table-input{
width:100%;
padding:15px;
border:none;
border-radius:15px;
font-size:20px;
margin-bottom:15px;
background:#06261b;
color:white;
}

.order-history-box{
background:#041b12;
padding:15px;
border-radius:20px;
margin-bottom:15px;
}

.history-title{
font-size:22px;
font-weight:bold;
margin-bottom:8px;
}

.history-text{
color:#9affd8;
margin-top:5px;
font-size:15px;
}

</style>

<script>

/* ===== СОХРАНЕНИЕ ===== */

let orderHistory =
JSON.parse(localStorage.getItem("orderHistory")) || [];

/* ===== НОМЕР СТОЛА ===== */

const orderBox = document.querySelector(".order-box");

const tableInputHTML = `
<input
id="tableNumber"
class="table-input"
placeholder="Номер столика">
`;

orderBox.insertAdjacentHTML(
"afterbegin",
tableInputHTML
);

/* ===== ИСТОРИЯ ===== */

function saveHistory(order){

orderHistory.push(order);

localStorage.setItem(
"orderHistory",
JSON.stringify(orderHistory)
);

}

/* ===== ПРИНЯТЬ ЗАКАЗ ===== */

function acceptOrder(){

if(currentOrder.length===0){

alert("Добавьте блюда");
return;

}

let table =
document.getElementById("tableNumber").value || "Без номера";

let total =
currentOrder.reduce((a,b)=>a+b.price,0);

let order = {

table:table,

items:[...currentOrder],

total:total,

time:new Date().toLocaleString()

};

/* обычные заказы */
orders.push(order);

/* история */
saveHistory(order);

/* сохранить */
saveData();

alert("Заказ принят");

/* очистка */

currentOrder=[];

renderOrder();

document.getElementById(
"tableNumber"
).value="";

}

/* ===== НАСТРОЙКИ ===== */

function openSettings(){

const modal =
document.getElementById("modal");

const content =
document.getElementById("modalContent");

let html = `
<h2>Настройки</h2>

<div style="
margin-bottom:20px;
font-size:20px;
font-weight:bold;
">
История всех заказов
</div>
`;

if(orderHistory.length===0){

html += `
<div class="order-history-box">
История пуста
</div>
`;

}

/* ВСЯ ИСТОРИЯ */

orderHistory.forEach((order,index)=>{

html += `

<div class="order-history-box">

<div class="history-title">
Заказ #${index+1}
</div>

<div class="history-text">
⏰ ${order.time}
</div>

<div class="history-text">
🪑 Столик:
${order.table}
</div>

<div class="history-text">
🍽 Блюда:
${order.items.map(i=>i.name).join(", ")}
</div>

<div class="history-text">
💰 Сумма:
${order.total} ₽
</div>

<button
style="
margin-top:15px;
width:100%;
padding:12px;
border:none;
border-radius:15px;
background:#ff2d55;
color:white;
font-size:16px;
font-weight:bold;
cursor:pointer;
"
onclick="deleteHistoryOrder(${index})">

Удалить из истории

</button>

</div>

`;

});

/* КНОПКИ */

html += `

<button
style="
margin-top:15px;
width:100%;
padding:15px;
border:none;
border-radius:18px;
background:#ff7a00;
color:white;
font-size:18px;
font-weight:bold;
cursor:pointer;
"
onclick="clearHistory()">

Очистить всю историю

</button>

<button
class="close-btn"
onclick="closeModal()">

Закрыть

</button>
`;

content.innerHTML = html;

modal.style.display="flex";

}

/* ===== УДАЛИТЬ ИЗ ИСТОРИИ ===== */

function deleteHistoryOrder(index){

if(confirm("Удалить заказ из истории?")){

orderHistory.splice(index,1);

localStorage.setItem(
"orderHistory",
JSON.stringify(orderHistory)
);

openSettings();

}

}

/* ===== ОЧИСТИТЬ ВСЮ ИСТОРИЮ ===== */

function clearHistory(){

if(confirm("Удалить всю историю заказов?")){

orderHistory=[];

localStorage.setItem(
"orderHistory",
JSON.stringify(orderHistory)
);

openSettings();

}

}

/* ===== УДАЛЕНИЕ КАТЕГОРИЙ ===== */

function deleteCategory(name){

if(confirm("Удалить категорию?")){

delete categories[name];

saveData();

renderCategories();

}

}

/* ===== РЕДАКТИРОВАНИЕ КАТЕГОРИИ ===== */

function editCategory(name){

let newName = prompt(
"Новое название",
name
);

if(!newName)return;

categories[newName] =
categories[name];

delete categories[name];

saveData();

renderCategories();

}

/* ===== РЕДАКТИРОВАНИЕ БЛЮДА ===== */

function editFood(category,index){

let food =
categories[category][index];

let newName =
prompt(
"Название блюда",
food.name
);

if(!newName)return;

let newPrice =
prompt(
"Цена",
food.price
);

food.name = newName;

food.price = Number(newPrice);

saveData();

openCategory(category);

}

/* ===== УДАЛЕНИЕ БЛЮДА ===== */

function deleteFood(category,index){

if(confirm("Удалить блюдо?")){

categories[category].splice(index,1);

saveData();

openCategory(category);

}

}

</script>

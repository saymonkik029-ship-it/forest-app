<!-- НОВЫЕ ФУНКЦИИ -->

<!-- 1. КНОПКА НАСТРОЕК -->

<button id="settingsBtn"
onclick="openSettings()"
style="
position:fixed;
right:20px;
bottom:20px;
width:70px;
height:70px;
border:none;
border-radius:50%;
background:#111827;
color:white;
font-size:30px;
cursor:pointer;
z-index:999;
box-shadow:0 0 20px rgba(0,0,0,0.5);
">
⚙️
</button>

<!-- 2. ОКНО НАСТРОЕК -->

<div class="modal" id="settingsModal">

<div class="modal-content">

<h2>
Настройки
</h2>

<h3 style="margin-bottom:15px;">
Все сохранённые заказы
</h3>

<div id="savedOrders"></div>

<button class="close-btn"
onclick="closeSettings()">
Закрыть
</button>

</div>

</div>

<!-- 3. НОМЕР СТОЛИКА -->

<input type="number"
id="tableNumber"
placeholder="Номер столика"
style="
width:100%;
padding:15px;
border:none;
border-radius:15px;
margin-bottom:15px;
background:#0f2f1f;
color:white;
font-size:18px;
">

<script>

/* =========================
СОХРАНЕНИЕ
========================= */

function saveData(){

localStorage.setItem(
"menu",
JSON.stringify(menu)
);

localStorage.setItem(
"orders",
JSON.stringify(allOrders)
);

}

/* =========================
УДАЛЕНИЕ КАТЕГОРИЙ
========================= */

function deleteCategory(category){

let confirmDelete = confirm(
"Удалить категорию " + category + " ?"
);

if(!confirmDelete) return;

delete menu[category];

saveData();

renderCategories();

}

/* =========================
РЕНДЕР КАТЕГОРИЙ
========================= */

function renderCategories(){

let container =
document.getElementById("categories");

container.innerHTML="";

Object.keys(menu).forEach(category=>{

container.innerHTML += `

<div class="category">

<div onclick="
openCategory('${category}')
">

${category}

</div>

<button
onclick="
deleteCategory('${category}')
"
style="
margin-top:15px;
background:red;
border:none;
padding:10px;
border-radius:12px;
color:white;
width:100%;
font-weight:bold;
cursor:pointer;
">
Удалить
</button>

</div>

`;

});

}

/* =========================
ПОДТВЕРЖДЕНИЕ ЗАКАЗА
========================= */

function confirmOrder(){

if(currentOrder.length===0){

alert("Заказ пуст");

return;

}

let table =
document.getElementById(
"tableNumber"
).value;

if(!table){

alert("Введите номер столика");

return;

}

let time =
new Date().toLocaleString();

allOrders.push({

table:table,

time:time,

items:[...currentOrder],

total:total

});

saveData();

alert("Заказ сохранён");

currentOrder=[];

total=0;

document.getElementById(
"tableNumber"
).value="";

renderOrder();

}

/* =========================
ОТКРЫТЬ ЗАКАЗЫ
========================= */

function openOrders(){

document.getElementById(
"ordersModal"
).style.display="flex";

let container =
document.getElementById(
"ordersHistory"
);

container.innerHTML="";

if(allOrders.length===0){

container.innerHTML=
"Нет заказов";

return;

}

allOrders.forEach((order,index)=>{

container.innerHTML += `

<div class="history-order">

<h3>
Заказ #${index+1}
</h3>

<p>
Столик:
<b>${order.table}</b>
</p>

<p>
${order.time}
</p>

<br>

${order.items.map(i=>`

${i.name} — ${i.price} ₽

`).join("<br>")}

<br><br>

<b>
Итого:
${order.total} ₽
</b>

<br><br>

<button
onclick="
editOrder(${index})
"
class="edit-btn">
Редактировать
</button>

<button
onclick="
deleteOrder(${index})
"
class="delete-btn">
Удалить
</button>

</div>

`;

});

}

/* =========================
УДАЛИТЬ ЗАКАЗ
========================= */

function deleteOrder(index){

let confirmDelete =
confirm("Удалить заказ?");

if(!confirmDelete) return;

allOrders.splice(index,1);

saveData();

openOrders();

}

/* =========================
РЕДАКТИРОВАТЬ ЗАКАЗ
========================= */

function editOrder(index){

let newTable = prompt(
"Новый номер столика",
allOrders[index].table
);

if(!newTable) return;

allOrders[index].table =
newTable;

saveData();

openOrders();

}

/* =========================
НАСТРОЙКИ
========================= */

function openSettings(){

document.getElementById(
"settingsModal"
).style.display="flex";

renderSavedOrders();

}

function closeSettings(){

document.getElementById(
"settingsModal"
).style.display="none";

}

function renderSavedOrders(){

let container =
document.getElementById(
"savedOrders"
);

container.innerHTML="";

if(allOrders.length===0){

container.innerHTML=
"Нет сохранённых заказов";

return;

}

allOrders.forEach((order,index)=>{

container.innerHTML += `

<div class="history-order">

<h3>
Заказ #${index+1}
</h3>

<p>
Столик:
${order.table}
</p>

<p>
${order.time}
</p>

<br>

<b>
${order.total} ₽
</b>

<br><br>

<button
onclick="
deleteSavedOrder(${index})
"
class="delete-btn">
Удалить навсегда
</button>

</div>

`;

});

}

/* =========================
УДАЛИТЬ НАВСЕГДА
========================= */

function deleteSavedOrder(index){

let confirmDelete =
confirm(
"Удалить заказ навсегда?"
);

if(!confirmDelete) return;

allOrders.splice(index,1);

saveData();

renderSavedOrders();

openOrders();

}

               </script>

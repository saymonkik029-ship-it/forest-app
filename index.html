<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Forest Restaurant PRO</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:
linear-gradient(90deg,#001a09,#003b12,#001a09);
color:white;
min-height:100vh;
padding:20px;
}

/* HEADER */

.header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:25px;
}

.logo{
display:flex;
align-items:center;
gap:12px;
}

.logo h1{
font-size:48px;
}

.logo p{
font-size:18px;
color:#8ee6c0;
}

.buttons{
display:flex;
gap:12px;
}

.top-btn{
border:none;
padding:18px 28px;
border-radius:22px;
font-size:20px;
font-weight:bold;
color:white;
cursor:pointer;
transition:0.3s;
}

.view-btn{
background:linear-gradient(45deg,#ff7a00,#ff2d55);
}

.orders-btn{
background:linear-gradient(45deg,#00bcd4,#2dd4bf);
}

.top-btn:hover{
transform:scale(1.05);
}

/* CATEGORY */

.categories{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
margin-top:20px;
}

.category{
background:rgba(0,0,0,0.55);
border-radius:30px;
padding:40px 25px;
font-size:30px;
font-weight:bold;
cursor:pointer;
transition:0.3s;
}

.category:hover{
background:#0f2f1f;
transform:translateY(-5px);
}

/* ORDER */

.order-box{
margin-top:35px;
background:rgba(0,0,0,0.6);
padding:30px;
border-radius:35px;
}

.order-box h2{
font-size:55px;
margin-bottom:20px;
}

.order-list{
margin-bottom:20px;
font-size:22px;
line-height:1.8;
}

.total{
display:flex;
justify-content:space-between;
font-size:28px;
font-weight:bold;
margin-top:10px;
margin-bottom:25px;
}

.accept-btn{
width:100%;
padding:28px;
border:none;
border-radius:30px;
font-size:34px;
font-weight:bold;
background:#22d3b6;
color:white;
cursor:pointer;
transition:0.3s;
}

.accept-btn:hover{
transform:scale(1.03);
background:#1bc9aa;
}

/* MOBILE */

@media(max-width:700px){

.logo h1{
font-size:28px;
}

.category{
font-size:22px;
padding:30px 20px;
}

.order-box h2{
font-size:36px;
}

.accept-btn{
font-size:24px;
padding:22px;
}

.top-btn{
padding:14px 20px;
font-size:18px;
}

}

</style>
</head>

<body>

<!-- HEADER -->

<div class="header">

<div class="logo">
<div style="font-size:50px">🌲</div>

<div>
<h1>Forest</h1>
<p>Restaurant PRO</p>
</div>
</div>

<div class="buttons">

<button class="top-btn view-btn"
onclick="changeView()">
+ Вид
</button>

<button class="top-btn orders-btn"
onclick="showOrders()">
Заказы
</button>

</div>

</div>

<!-- CATEGORIES -->

<div class="categories">

<div class="category"
onclick="addDish('Борщ',450)">
Первое
</div>

<div class="category"
onclick="addDish('Стейк',1200)">
Второе
</div>

<div class="category"
onclick="addDish('Торт',350)">
Десерты
</div>

<div class="category"
onclick="addDish('Лимонад',250)">
Напитки
</div>

<div class="category"
onclick="addDish('Вино',1800)">
Алкоголь
</div>

</div>

<!-- ORDER -->

<div class="order-box">

<h2>Текущий заказ</h2>

<div class="order-list" id="orderList">
Ничего не выбрано
</div>

<div class="total">
<span>Итого</span>
<span id="total">0 ₽</span>
</div>

<button class="accept-btn"
onclick="acceptOrder()">
Принять заказ
</button>

</div>

<script>

let total = 0;
let orders = [];

function addDish(name,price){

orders.push(name + " — " + price + " ₽");

total += price;

document.getElementById("orderList").innerHTML =
orders.join("<br>");

document.getElementById("total").innerText =
total + " ₽";

}

function acceptOrder(){

if(total === 0){
alert("Добавьте блюда");
return;
}

alert("Заказ принят!");

orders = [];
total = 0;

document.getElementById("orderList").innerHTML =
"Ничего не выбрано";

document.getElementById("total").innerText =
"0 ₽";

}

function showOrders(){

if(orders.length === 0){
alert("Заказов пока нет");
}else{
alert("Текущих блюд: " + orders.length);
}

}

function changeView(){

document.body.style.background =
"linear-gradient(90deg,#021b0d,#065f46,#021b0d)";

alert("Вид изменён");

}

</script>

</body>
</html>
